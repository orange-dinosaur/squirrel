version: 2

builds:
  - main: .
    binary: squirrel
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/orange-dinosaur/squirrel/internal/cli.version={{ .Version }}
      - -X github.com/orange-dinosaur/squirrel/internal/cli.commit={{ .Commit }}

archives:
  - formats: [tar.gz]
    name_template: "squirrel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256
